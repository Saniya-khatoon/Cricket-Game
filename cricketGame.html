<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bat Ball Stump Game</title>
  <link rel="stylesheet" href="cricketGame.css">
</head>

<body>
  <div class="game-container">
    <h1>🏏 Bat Ball Stump</h1>
    <p class="subtitle">Choose your move and beat the computer!</p>

    <div class="choices">
      <button class="choice-button" onclick="playGame('Bat')">
        <img src="bat.jpg" alt="Bat">
        <span>Bat</span>
      </button>

      <button class="choice-button" onclick="playGame('Ball')">
        <img src="ball.jpg" alt="Ball">
        <span>Ball</span>
      </button>

      <button class="choice-button" onclick="playGame('Stump')">
        <img src="stump.jpg" alt="Stump">
        <span>Stump</span>
      </button>
    </div>

    <div class="result-box">
      <h3 id="user-move"></h3>
      <h3 id="computer-move"></h3>
      <h2 id="result"></h2>
      <p id="score"></p>
    </div>

    <button class="reset-btn" onclick="resetGame()">🔄 Reset Game</button>
  </div>

  <script src="cricketGame.js"></script>
</body>
</html>
